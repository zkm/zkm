name: Neofetch Card

on:
  push:
    branches: [ master ]
    paths:
      - today.py
      - cache/requirements.txt
      - .github/workflows/neofetch-card.yml
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neofetch-card
  cancel-in-progress: false

jobs:
  build:
    name: Update neofetch card
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update card stats
        env:
          ACCESS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update neofetch card"
          # the profile-summary-cards job also pushes to master daily
          git pull --rebase origin master
          git push origin HEAD:master
